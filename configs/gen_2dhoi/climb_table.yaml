character: kid
character_dir: data/characters
texture_dir: data/characters
results_dir: results_collection/climb_table001
object_config: configs/objects/comasset.yaml
verbose: false
skip_step1: true
skip_step2: true
skip_step3: false
skip_step4: false
skip_done: false
paths:
  prompts_dir: "generation/prompts"
  initial_state_dir: "generation/initial_states"
  obj_scale_dir: "generation/obj_scales"
  render_dir: "generation/asset_renders"
  camera_dir: "generation/cameras"
  foundation_pose_input_dir: "generation/foundation_pose"
  depth_save_dir: "generation/depth_maps"
  video_output_dir: "generation/videos_kling"
simulation:
  drop_height: 0.1
  settling_time: 5.0
  initial_rotation_perturbation: 5.0
  seed: 42
  save_usd: false
  use_initial_state: true
scale:
  max_iterations: 5
rendering:
  samples: 128
  width: 1280
  height: 720
  num_rand_scenes: 1
  gpu: true
  no_rand_seed: true
  render_start_end: false
video:
  num_videos: 1
  num_video_segments: 2
  model_api: kling-ai
  kling_model_name: kling-v2-5-turbo
  duration: "5"
  kling_mode: std
  skip_prompt_refinement: true
  base_prompt: "The person walks up to the wooden table in front of them and climbs up onto it, using their hands and knees for support while pulling themselves up. The camera should remain static.#The person stands upright on top of the table, balancing carefully with both feet planted on the tabletop, and remains standing there without moving. The camera should remain static."
  seg_idx_for_tail_image: -1
  use_all_tail_images: false
  video_max_retries: 3
  video_retry_wait: 5
scene_config: configs/scenes/default.yaml
